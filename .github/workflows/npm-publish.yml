name: Publish Climate Cntrl to npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        default: v0.5.0-beta.3
permissions:
  contents: read
concurrency:
  group: climate-npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'pponce/homebridge-nest-climate-cntrl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate package and published GitHub release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          assert.equal(pkg.name, 'homebridge-nest-climate-cntrl');
          assert.equal('v' + pkg.version, process.env.RELEASE_TAG);
          const channel = pkg.version.includes('-') ? 'beta' : 'latest';
          fs.appendFileSync(process.env.GITHUB_ENV, 'NPM_TAG=' + channel + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'VERSION=' + pkg.version + '\n');
          NODE
      - name: Download and verify the tested release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-package
          gh release download "$RELEASE_TAG" --dir release-package --pattern "homebridge-nest-climate-cntrl-$VERSION.tgz" --pattern SHA256SUMS
          cd release-package
          sha256sum --check --ignore-missing SHA256SUMS
      - name: Publish the release package
        run: npm publish "release-package/homebridge-nest-climate-cntrl-$VERSION.tgz" --ignore-scripts --access public --tag "$NPM_TAG"

