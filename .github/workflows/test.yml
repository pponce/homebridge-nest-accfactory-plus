name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            homebridge: 1.11.4
          - node: 22
            homebridge: 2.4.0
          - node: 24
            homebridge: 1.11.4
          - node: 24
            homebridge: 2.4.0
          - node: 26
            homebridge: 2.4.0
          - node: 24
            homebridge: 2.5.0

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm install --no-save --package-lock=false homebridge@${{ matrix.homebridge }}
      - name: Run project checks
        id: validation
        continue-on-error: true
        run: node maintenance/checks/run-migration-check.mjs check
      - name: "${{ steps.validation.outputs.detail }}"
        if: always() && steps.validation.outcome != 'skipped'
        run: test '${{ steps.validation.outcome }}' = 'success'
      - name: Verify migration through Homebridge cache restoration
        id: migration
        continue-on-error: true
        run: node maintenance/checks/run-migration-check.mjs
      - name: "${{ steps.migration.outputs.detail }}"
        if: always() && steps.migration.outcome != 'skipped'
        run: test '${{ steps.migration.outcome }}' = 'success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node }}-homebridge-${{ matrix.homebridge }}
          path: coverage/summary.json


  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test configuration dashboard in Chromium
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/climate-browser" playwright
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/climate-browser/node_modules/playwright" CHROMIUM_PATH="$(command -v google-chrome)" node maintenance/checks/dashboard-browser.mjs
