name: Release Climate Cntrl
on:
  push:
    branches: [main]
    paths: [.github/release-version]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climate-release
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'pponce/homebridge-nest-climate-cntrl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 22
            homebridge: 1.11.4
          - node: 22
            homebridge: 2.4.0
          - node: 24
            homebridge: 1.11.4
          - node: 24
            homebridge: 2.4.0
          - node: 26
            homebridge: 2.4.0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false homebridge@${{ matrix.homebridge }}
      - run: npm run check
  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check dashboard behavior
        run: |
          npm install --prefix "$RUNNER_TEMP/climate-browser" playwright
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/climate-browser/node_modules/playwright" CHROMIUM_PATH="$(command -v google-chrome)" node maintenance/checks/dashboard-browser.mjs
  release:
    needs: [test, dashboard-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release intent and notes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          assert.equal(pkg.name, 'homebridge-nest-climate-cntrl');
          assert.equal(fs.readFileSync('.github/release-version', 'utf8').trim(), pkg.version);
          const source = fs.readFileSync(pkg.version.includes('-') ? 'PRERELEASE_NOTES.md' : 'CHANGELOG.md', 'utf8');
          const section = source.split('## v' + pkg.version + '\n')[1]?.split('\n## ')[0]?.trim();
          assert.ok(section, 'Missing exact release notes');
          fs.writeFileSync('RELEASE_NOTES.md', section + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'VERSION=' + pkg.version + '\n');
          NODE
      - run: node scripts/check-package.js
      - name: Prepare migration helper and checksums
        run: |
          cp scripts/migration-preflight.mjs nest-climate-migration-preflight.mjs
          cp maintenance/publish-beta-and-inspect.sh publish-beta-and-inspect.sh
          sha256sum "homebridge-nest-climate-cntrl-$VERSION.tgz" nest-climate-migration-preflight.mjs publish-beta-and-inspect.sh > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
          else
            flags=()
            if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); fi
            gh release create "v$VERSION" "homebridge-nest-climate-cntrl-$VERSION.tgz" nest-climate-migration-preflight.mjs publish-beta-and-inspect.sh SHA256SUMS \
              --target "$GITHUB_SHA" --title "Nest Climate Cntrl v$VERSION" \
              --notes-file RELEASE_NOTES.md "${flags[@]}"
          fi

