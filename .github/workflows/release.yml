name: Release Climate Cntrl
on:
  push:
    branches: [main]
    paths: [.github/release-version, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climate-release
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'pponce/homebridge-nest-climate-cntrl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            homebridge: 1.11.4
          - node: 22
            homebridge: 2.4.0
          - node: 24
            homebridge: 1.11.4
          - node: 24
            homebridge: 2.4.0
          - node: 26
            homebridge: 2.4.0
          - node: 24
            homebridge: 2.5.0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false homebridge@${{ matrix.homebridge }}
      - name: Run project checks
        id: validation
        continue-on-error: true
        run: node maintenance/checks/run-migration-check.mjs check
      - name: "${{ steps.validation.outputs.detail }}"
        if: always() && steps.validation.outcome != 'skipped'
        run: test '${{ steps.validation.outcome }}' = 'success'
  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prepare browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/climate-browser" playwright
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/climate-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "REVIEW_OUTPUT_DIR=$RUNNER_TEMP/climate-dashboard-review" >> "$GITHUB_ENV"
      - name: Verify rule field help, dashboard layouts and secure browser sessions
        id: browser
        continue-on-error: true
        run: node maintenance/checks/run-dashboard-browser.mjs
      - name: "${{ steps.browser.outputs.detail }}"
        if: always() && steps.browser.outcome != 'skipped'
        run: test '${{ steps.browser.outcome }}' = 'success'
      - name: Retain dashboard screenshots for release review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-dashboard-review
          path: ${{ runner.temp }}/climate-dashboard-review
  release:
    # Publish only after every matrix combination and browser check passes on this commit.
    needs: [test, dashboard-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release intent and notes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          assert.equal(pkg.name, 'homebridge-nest-climate-cntrl');
          assert.equal(fs.readFileSync('.github/release-version', 'utf8').trim(), pkg.version);
          const source = fs.readFileSync(pkg.version.includes('-') ? 'PRERELEASE_NOTES.md' : 'CHANGELOG.md', 'utf8');
          const section = source.split('## v' + pkg.version + '\n')[1]?.split('\n## ')[0]?.trim();
          assert.ok(section, 'Missing exact release notes');
          fs.writeFileSync('RELEASE_NOTES.md', section + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'VERSION=' + pkg.version + '\n');
          NODE
      - run: node scripts/check-package.js
      - name: Check the installer and GitHub-to-npm publication helper
        run: |
          python3 maintenance/checks/publish-beta-runner.py
          python3 maintenance/checks/install-execution-runner.py
      - name: Prepare release helpers and checksums
        run: |
          cp scripts/migration-preflight.mjs nest-climate-migration-preflight.mjs
          cp maintenance/update-checkout-and-publish-beta.sh update-checkout-and-publish-beta.sh
          cp maintenance/install-execution-beta.sh install-execution-beta.sh
          sha256sum "homebridge-nest-climate-cntrl-$VERSION.tgz" nest-climate-migration-preflight.mjs update-checkout-and-publish-beta.sh install-execution-beta.sh > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
          else
            flags=()
            if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); fi
            gh release create "v$VERSION" "homebridge-nest-climate-cntrl-$VERSION.tgz" nest-climate-migration-preflight.mjs update-checkout-and-publish-beta.sh install-execution-beta.sh SHA256SUMS \
              --target "$GITHUB_SHA" --title "Nest Climate Cntrl v$VERSION" \
              --notes-file RELEASE_NOTES.md "${flags[@]}"
          fi
