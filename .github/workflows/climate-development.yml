name: Climate development validation
on:
  push:
    branches: [feature/thermostat-dashboard]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply project formatting to climate changes
        run: |
          npx prettier --write src/climate-dashboard.js src/config.js src/devices.js src/system.js src/plugins/thermostat.js test/climate-controls.test.js test/climate-dashboard.test.js homebridge-ui
          npx eslint --fix src/climate-dashboard.js src/config.js src/devices.js src/system.js src/plugins/thermostat.js test/climate-controls.test.js test/climate-dashboard.test.js
      - name: Save formatting on development branch
        run: |
          git add src/climate-dashboard.js src/config.js src/devices.js src/system.js src/plugins/thermostat.js test/climate-controls.test.js test/climate-dashboard.test.js homebridge-ui
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format climate dashboard and controls'
            git push origin HEAD:feature/thermostat-dashboard
          fi
      - run: npm run check 2>&1 | tee "$RUNNER_TEMP/climate-check.log"
      - name: Browser behavior checks
        if: always()
        run: |
          npm install --prefix "$RUNNER_TEMP/climate-browser" playwright
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/climate-browser/node_modules/playwright" CHROMIUM_PATH="$(command -v google-chrome)" node maintenance/checks/dashboard-browser.mjs 2>&1 | tee "$RUNNER_TEMP/climate-browser.log"
      - name: Record validation diagnostics on development branch
        if: always()
        run: |
          mkdir -p maintenance/checks
          python - <<'PYTHON'
          import os, pathlib
          report = []
          for name in ['climate-check.log', 'climate-browser.log']:
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / name
              report.append('=== ' + name + ' ===')
              if path.exists():
                  lines = path.read_text(errors='replace').splitlines()
                  indexes = set(range(max(0, len(lines)-90), len(lines)))
                  for i, line in enumerate(lines):
                      if any(word in line for word in ['error', 'warning', 'not ok', '✖', 'AssertionError', 'Coverage gate failed']):
                          indexes.update(range(max(0,i-2), min(len(lines),i+22)))
                  report.extend(lines[i] for i in sorted(indexes))
          pathlib.Path('maintenance/checks/ci-result.txt').write_text('\n'.join(report)+'\n')
          PYTHON
          git add maintenance/checks/ci-result.txt
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record climate development validation results'
            git push origin HEAD:feature/thermostat-dashboard
          fi
