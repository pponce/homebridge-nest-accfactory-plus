name: Climate discovery development validation
on:
  push:
    branches: [feature/thermostat-dashboard]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Format changed climate sources
        run: |
          npx prettier --write src/identity.js src/config.js src/system.js src/plugins/thermostat.js src/climate-dashboard.js test/identity.test.js test/config.test.js test/climate-sources.test.js test/platform.test.js scripts/check-package.js homebridge-ui
          npx eslint --fix src/identity.js src/config.js src/system.js src/plugins/thermostat.js src/climate-dashboard.js test/identity.test.js test/config.test.js test/climate-sources.test.js test/platform.test.js scripts/check-package.js
      - name: Save dependency lock and formatting
        run: |
          git add package-lock.json src test scripts/check-package.js homebridge-ui
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Lock discovery dependency and format climate sources'
            git push origin HEAD:feature/thermostat-dashboard
          fi
      - run: npm run check 2>&1 | tee "$RUNNER_TEMP/climate-check.log"
      - name: Browser behavior checks
        if: always()
        run: |
          npm install --prefix "$RUNNER_TEMP/climate-browser" playwright
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/climate-browser/node_modules/playwright" CHROMIUM_PATH="$(command -v google-chrome)" node maintenance/checks/dashboard-browser.mjs 2>&1 | tee "$RUNNER_TEMP/climate-browser.log"
      - name: Record diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import pathlib,os,re
          report=[]
          for name in ['climate-check.log','climate-browser.log']:
              file=pathlib.Path(os.environ['RUNNER_TEMP'])/name
              report.append('=== '+name+' ===')
              if not file.exists(): continue
              lines=file.read_text(errors='replace').splitlines()
              indexes=set(range(max(0,len(lines)-90),len(lines)))
              for i,line in enumerate(lines):
                  if re.search(r'^(?:✖|not ok|Error:)|AssertionError|Coverage gate failed|\d+:\d+.*(?:warning|error)',line):
                      indexes.update(range(max(0,i-2),min(len(lines),i+30)))
              report.extend(lines[i] for i in sorted(indexes))
          pathlib.Path('maintenance/checks/ci-result.txt').write_text('\n'.join(report)+'\n')
          PY
          git add maintenance/checks/ci-result.txt
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record discovery validation results'
            git push origin HEAD:feature/thermostat-dashboard
          fi
