name: Climate development validation
on:
  push:
    branches: [feature/thermostat-dashboard]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply project formatting to climate changes
        run: |
          npx prettier --write src/climate-dashboard.js src/config.js src/devices.js src/system.js src/plugins/thermostat.js test/climate-controls.test.js test/climate-dashboard.test.js homebridge-ui
          npx eslint --fix src/climate-dashboard.js src/config.js src/devices.js src/system.js src/plugins/thermostat.js test/climate-controls.test.js test/climate-dashboard.test.js
      - name: Save formatting on development branch
        run: |
          git add src/climate-dashboard.js src/config.js src/devices.js src/system.js src/plugins/thermostat.js test/climate-controls.test.js test/climate-dashboard.test.js homebridge-ui
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format climate dashboard and controls'
            git push origin HEAD:feature/thermostat-dashboard
          fi
      - run: npm run check
      - name: Browser behavior checks
        run: |
          npm install --prefix "$RUNNER_TEMP/climate-browser" playwright
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/climate-browser/node_modules/playwright" CHROMIUM_PATH="$(command -v google-chrome)" node maintenance/checks/dashboard-browser.mjs
